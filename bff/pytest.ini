[pytest]
testpaths = tests
# `auto`: um `async def test_…` roda sem precisar de marcador em cada função. As rotas do
# painel que falam com os upstreams são assíncronas, e os testes que as exercitam também;
# exigir @pytest.mark.asyncio em cada uma só criaria a chance de esquecer o marcador — e
# um teste async sem marcador não FALHA, ele é pulado com um aviso fácil de não ler.
asyncio_mode = auto
