<!-- Selo cheio do Gestão Solar. A construção do handoff: quadrado âmbar, raio 25% do lado
     (14px num selo de 56, 8px num de 32), monograma `GS` em Figtree 700 com
     letter-spacing -.04em, corpo a 43,75% do lado, óptica centrada pela altura de caixa alta.

     O glifo é CONTORNO, não `<text>`: um favicon e um PDF são renderizados fora da página,
     onde `/fontes/Figtree-700.ttf` não está carregada — com `<text>` a marca cairia na sans
     do sistema e deixaria de ser a marca. Os contornos saem da própria Figtree-700.ttf de
     `public/fontes/`, então mudar a fonte da marca exige regerar este arquivo.

     viewBox de 100: use em qualquer tamanho, o raio e o glifo acompanham. -->
