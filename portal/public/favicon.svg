<!-- O favicon. Arquivo PRÓPRIO, e não o `marca/gs-selo.svg` reduzido: a 16 px o corpo do
     glifo do selo (43,75% do lado) fecha os vãos do `G` e do `S` e a marca lê como um
     quadrado âmbar. Aqui o corpo vai a 47% (7,5 px em 16) — é a compensação óptica que o
     handoff pede para o 16 px, e o raio segue os mesmos 25% do lado.

     Contorno, não `<text>`: o favicon é desenhado fora da página e não enxerga
     `/fontes/Figtree-700.ttf`. Gerado da própria Figtree-700, como `marca/gs-selo.svg`. -->
