# Servidor do portal do cliente. Serve arquivo estático e mais nada — a API é outro serviço.

server {
    # `$PORT` é injetada pelo Railway e muda a cada deploy; o entrypoint a substitui aqui
    # antes de o nginx subir. Porta fixa faria o roteador não encontrar o contêiner.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O portal é aberto por gente de fora da empresa, em rede que não controlamos. Os
    # cabeçalhos abaixo fecham o que custa nada fechar: ninguém embute o portal num iframe
    # (clickjacking), o navegador não "adivinha" tipo de arquivo, e a URL de uma tela —
    # que carrega o id da usina — não vaza no Referer para terceiros.
    # Atenção à regra do nginx: um `add_header` dentro de um `location` DESCARTA os herdados
    # daqui. Por isso os três se repetem nos blocos abaixo que têm cabeçalho próprio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão para o que domina o tráfego: os bundles e o CSS.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Verificação de saúde do Railway. Separada de `/` de propósito: `/` devolve o
    # index.html mesmo com o build quebrado, e o healthcheck diria "saudável" para um
    # portal que não abre.
    location = /saude {
        default_type text/plain;
        return 200 "ok";
    }

    # Aplicação de página única: o roteamento acontece no navegador, e toda rota tem de
    # devolver o mesmo HTML. Sem isto, recarregar em /usinas/3/cronograma dá 404 — e o
    # cliente não consegue favoritar uma tela nem voltar pelo botão do navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets têm hash no nome: mudou o conteúdo, mudou o nome. Podem ser guardados para
    # sempre, sem risco de servir versão velha.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # As seis faces da marca. O tipo declarado não é preciosismo: como
    # `application/octet-stream` o navegador baixa a fonte mas alguns motores recusam
    # aplicá-la, e a página cai na fonte de sistema sem erro nenhum no console.
    location /fontes/ {
        types { font/ttf ttf; }
        default_type font/ttf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # O index e a configuração NÃO podem ser guardados: são justamente o que aponta para os
    # assets novos e para o endereço da API. Em cache, um deploy não chegaria a quem já
    # abriu a página antes.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /config.js {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
