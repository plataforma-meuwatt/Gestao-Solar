# Servidor do painel. Serve arquivo estático e mais nada — a API é outro serviço.

server {
    # `$PORT` é injetada pelo Railway e muda a cada deploy; o entrypoint a substitui aqui
    # antes de o nginx subir. Porta fixa faria o roteador não encontrar o contêiner.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão para o que domina o tráfego desta página: um bundle de ~330 kB que cai
    # para ~100 kB comprimido.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # O painel é uma aplicação de página única: o roteamento acontece no navegador, e toda
    # rota tem de devolver o mesmo HTML. Sem isto, recarregar em /clientes/3 dá 404 — e o
    # gestor não consegue favoritar uma tela nem voltar pelo botão do navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets têm hash no nome (`index-DwXJtxVK.js`): mudou o conteúdo, mudou o nome.
    # Por isso podem ser guardados para sempre, sem risco de servir versão velha.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # As seis faces da marca. O tipo declarado não é preciosismo: como
    # `application/octet-stream` o navegador baixa a fonte mas alguns motores recusam
    # aplicá-la, e a página cai na fonte de sistema sem erro nenhum no console.
    location /fontes/ {
        types { font/ttf ttf; }
        default_type font/ttf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index e a configuração NÃO podem ser guardados: são justamente o que aponta para os
    # assets novos e para o endereço da API. Em cache, um deploy não chegaria a quem já
    # abriu a página antes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
